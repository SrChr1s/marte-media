name: Release

# Pushing a tag like v0.2.0 builds the packages and publishes a GitHub release.
# A tag with a suffix (v0.2.0-rc.1) is published as a pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev nsis

      - name: Tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0

      - name: The tag matches wails.json
        run: |
          want=$(python3 -c "import json;print(json.load(open('wails.json'))['info']['productVersion'])")
          [ "v$want" = "${GITHUB_REF_NAME%%-*}" ] || { echo "tag $GITHUB_REF_NAME does not match productVersion $want" >&2; exit 1; }

      - name: Tests
        run: |
          go vet -tags webkit2_41 ./...
          go test -race -tags webkit2_41 ./...
          npm --prefix frontend ci
          npm --prefix frontend run check
          npm --prefix frontend test

      - name: Bundled binaries
        run: scripts/fetch-deps.sh

      - name: Packages
        run: |
          scripts/package.sh linux
          scripts/package.sh windows

      - name: Checksums
        working-directory: build/bin
        run: sha256sum *.deb *.rpm *-installer.exe | tee SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$1=="##" && $2==v {f=1; next} f && $1=="##" {exit} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" $pre --title "Marte Media ${GITHUB_REF_NAME#v}" --notes "$notes" \
            build/bin/*.deb build/bin/*.rpm build/bin/*-installer.exe build/bin/SHA256SUMS
